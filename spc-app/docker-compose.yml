# 三容器：后端 Go/Echo、前端 nginx:1.27-alpine、postgres:16-alpine。
# 浏览器直接访问 http://localhost:8088 （nginx），由其反代 /api 到后端。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spc
      POSTGRES_PASSWORD: spc
      POSTGRES_DB: spc
    volumes:
      - spc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spc -d spc"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPC_ADDR: ":8080"
      DATABASE_URL: "postgres://spc:spc@db:5432/spc?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  spc_pgdata:
